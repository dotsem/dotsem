<div
  style="display: flex; flex-direction: row; justify-content: space-between; width: 800px; height: 300px; background-color: transparent; color: {{TEXT_PRIMARY}}; border: 1px solid {{BORDER_OUTER}}; padding: 20px; font-family: 'JetBrains Mono'; box-sizing: border-box;">

  <!-- Left Column: Recent Projects -->
  <div style="display: flex; flex-direction: column; width: 440px;">
    <span
      style="color: {{TEXT_MUTED}}; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 10px;">RECENT
      PROJECTS</span>
    {{PROJECTS}}
  </div>

  <!-- Middle Divider -->
  <div style="width: 1px; background-color: {{BORDER_INNER}}; margin: 0 16px; height: 260px;"></div>

  <!-- Right Column: Focus Areas & Languages -->
  <div style="display: flex; flex-direction: column; width: 288px;">
    <!-- Focus Areas -->
    <span
      style="color: {{TEXT_MUTED}}; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px;">FOCUS
      AREAS</span>
    <div style="display: flex; flex-direction: column; margin-bottom: 14px;">
      <div style="display: flex; align-items: center; margin-bottom: 4px; font-size: 12px;">
        <span style="color: {{ACCENT_BULLET}}; font-weight: 600; margin-right: 8px;">›</span>
        <span>Backend APIs & Servers</span>
      </div>
      <div style="display: flex; align-items: center; margin-bottom: 4px; font-size: 12px;">
        <span style="color: {{ACCENT_BULLET}}; font-weight: 600; margin-right: 8px;">›</span>
        <span>Cross platform apps in Flutter</span>
      </div>
      <div style="display: flex; align-items: center; margin-bottom: 4px; font-size: 12px;">
        <span style="color: {{ACCENT_BULLET}}; font-weight: 600; margin-right: 8px;">›</span>
        <span>Low level coding in Rust & C++</span>
      </div>
      <div style="display: flex; align-items: center; font-size: 12px;">
        <span style="color: {{ACCENT_BULLET}}; font-weight: 600; margin-right: 8px;">›</span>
        <span>Fast & reactive frontends with Svelte</span>
      </div>
    </div>

    <!-- Languages Header -->
    <span style="color: {{TEXT_MUTED}}; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px;">TOP
      6 LANGUAGES</span>

    <!-- Distribution Bar -->
    <div
      style="display: flex; width: 288px; height: 8px; background-color: {{BAR_BG}}; margin-bottom: 10px; overflow: hidden;">
      {{LANG_BAR}}
    </div>

    <!-- Language List -->
    <div style="display: flex; flex-direction: column; font-size: 12px;">
      {{LANG_LIST}}
    </div>

    <!-- Environment Footer -->
    <div
      style="display: flex; border-top: 1px solid {{BORDER_INNER}}; padding-top: 8px; margin-top: auto; font-size: 11px; color: {{TEXT_MUTED}};">
      <span>Environment: {{ENVIRONMENT}}</span>
    </div>
  </div>

</div>
